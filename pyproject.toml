[project]
name = "fieldglass"
version = "0.1.0"
description = "Local earthquake and station-observation dashboard API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.1",
    "httpx==0.28.1",
    "uvicorn==0.47.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
